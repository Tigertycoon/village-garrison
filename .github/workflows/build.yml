name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Check resource JSON
        run: python3 scripts/check_resources.py
      - name: Build and run regression tests
        run: ./gradlew clean build --no-daemon --console=plain --max-workers=2
      - name: Upload mod JARs and test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-and-test-results
          path: |
            **/build/libs/*.jar
            **/build/reports/tests/**
            **/build/test-results/test/*.xml
          if-no-files-found: error
