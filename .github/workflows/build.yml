name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Check resource JSON
        run: python3 scripts/check_resources.py
      - name: Build and run regression tests
        run: ./gradlew clean build --no-daemon --console=plain --max-workers=2
      - name: Upload mod JARs and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-and-test-results
          path: |
            **/build/libs/*.jar
            **/build/reports/tests/**
            **/build/test-results/test/*.xml
          if-no-files-found: error
